<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commo Resource</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    color-scheme:dark;
    --bg:#000000; --surface:#0D0D0D; --surface-2:#141414;
    --line:#2B2B2B; --line-soft:#1D1D1D;
    --ink:#EDEDEB; --ink-2:#9A9A96; --ink-3:#666663;
    --copper:#5FB49C; --signal:#E0714B; --amber:#CFA640; --core:#E8C15A;
    --hover:#1C1C1C; --radius:3px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}

  header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:14px}
  .titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:29px;line-height:1.1;margin:0;letter-spacing:-0.02em;font-weight:700}
  .sub{margin:8px 0 0;color:var(--ink-2);font-size:14px;max-width:64ch}
  .readout{text-align:right;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
  .readout b{display:block;font-size:25px;color:var(--ink);font-weight:700;line-height:1}

  .modes{display:flex;margin:18px 0 0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;width:fit-content}
  .mode{padding:9px 22px;background:none;border:none;border-right:1px solid var(--line);color:var(--ink-2);font-size:15px;font-weight:600;cursor:pointer}
  .mode:last-child{border-right:none}
  .mode:hover{background:var(--hover);color:var(--ink)}
  .mode[aria-selected="true"]{background:var(--copper);color:#07120F}
  .mode .n{font-size:12px;opacity:.7;margin-left:6px;font-weight:500}
  .modehint{margin:8px 0 0;color:var(--ink-3);font-size:12.5px}

  .searchrow{margin:14px 0 4px}
  .searchrow input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);font:inherit;color:var(--ink)}
  .searchrow input:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:var(--copper)}
  .crosshit{margin:8px 0 0;font-size:13px;color:var(--ink-3)}
  .crosshit button{padding:3px 9px;font-size:12.5px;margin-left:6px}

  button{font:inherit;font-size:13.5px;padding:9px 13px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:var(--radius);cursor:pointer}
  button:hover{border-color:var(--ink-3)}
  button:focus-visible{outline:2px solid var(--copper);outline-offset:1px}
  button.primary{background:var(--copper);color:#0A0A0A;border-color:var(--copper);font-weight:600}
  button.primary:hover{background:#74C6AE;border-color:#74C6AE}
  input[type=file]{display:none}

  .level{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .level:last-child{border-bottom:none}
  .level .lbl{width:52px;flex:none;color:var(--ink-3);font-size:12px}
  .tab{padding:5px 11px;border:1px solid transparent;border-radius:var(--radius);background:none;color:var(--ink-2);font-size:14px}
  .tab .n{color:var(--ink-3);font-size:12px;margin-left:5px}
  .tab:hover{background:var(--hover);color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--ink);color:#0A0A0A;border-color:var(--ink);font-weight:600}
  .tab[aria-selected="true"] .n{color:#4A4A48}
  .l1 .tab{font-size:16px;font-weight:600;color:var(--ink)}
  .l1 .tab[aria-selected="true"]{background:var(--copper);color:#07120F;border-color:var(--copper)}
  .l1 .tab.corebtn{color:var(--core)}
  .l1 .tab.corebtn[aria-selected="true"]{background:var(--core);color:#171102;border-color:var(--core)}

  .listhead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .listhead h2{font-size:15px;margin:0;font-weight:600}
  .listhead span{color:var(--ink-3);font-size:13px}

  .src{background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--ink-3);border-radius:var(--radius);padding:14px 16px;margin-bottom:9px}
  .src.r3{border-left-color:var(--signal)}
  .src.r2{border-left-color:var(--copper)}
  .src.r1{border-left-color:var(--amber)}
  .src.core{border-left-color:var(--core)}
  .srctop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .name{font-size:17px;font-weight:700;letter-spacing:-0.01em;margin:0}
  .name a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--copper);padding-bottom:1px}
  .name a:hover{color:var(--copper)}
  .name a:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .bars{display:flex;gap:2px;align-items:center}
  .bars i{width:8px;height:13px;background:var(--line);display:block;border-radius:1px}
  .bars i.on{background:var(--signal)}
  .bars em{font-style:normal;color:var(--ink-3);font-size:12px;margin-left:5px}
  .corepill{background:var(--core);color:#171102;font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 0}
  .cover{background:var(--hover);color:var(--ink-2);font-size:12.5px;padding:2px 8px;border-radius:2px}
  .tagpath{color:var(--ink-3);font-size:12.5px;padding:2px 8px;border:1px solid var(--line);border-radius:2px}
  .cadence{color:var(--copper);font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:2px}
  .desc{margin:8px 0 0;color:var(--ink-2);font-size:14px;max-width:76ch}
  .url{display:block;margin-top:10px;font-size:12.5px;color:var(--ink-3);word-break:break-all}
  .empty{padding:34px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--radius)}
  .empty b{display:block;color:var(--ink);margin-bottom:6px}

  /* 메모 */
  .memoform{margin:4px 0 18px}
  .memoform textarea{width:100%;min-height:78px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);color:var(--ink);font:inherit;resize:vertical}
  .memoform textarea:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:var(--copper)}
  .memoform .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
  .memoform .row span{color:var(--ink-3);font-size:12.5px}
  .memo{background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--copper);border-radius:var(--radius);padding:13px 15px;margin-bottom:9px}
  .memo .body{white-space:pre-wrap;font-size:14px;color:var(--ink-2)}
  .memo .body a{color:var(--copper);word-break:break-all}
  .memo .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:9px}
  .memo .acts button{padding:4px 10px;font-size:12.5px}
  .memo textarea{width:100%;min-height:110px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);color:var(--ink);font:inherit}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
  footer p{margin:4px 0;max-width:84ch}
  .datatools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .datatools .cap{color:var(--ink-3);font-size:12.5px;margin-right:4px}
  .datatools button{font-size:12.5px;padding:6px 11px}
  .status{font-size:12.5px;color:var(--copper)}

  @media (max-width:640px){
    h1{font-size:23px}
    .readout{text-align:left}
    .level .lbl{width:100%;margin-bottom:2px}
    .wrap{padding:20px 14px 48px}
    .mode{padding:9px 15px;font-size:14px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="titlerow">
    <div>
      <h1>Commo Resource</h1>
      <p class="sub">매일 훑는 뉴스와, 발표 주체가 직접 올리는 휴민트</p>
    </div>
    <div class="readout"><b id="total">0</b>등록된 소스</div>
  </div>
  <div class="modes" id="modes"></div>
  <p class="modehint" id="modehint"></p>
  <div class="searchrow" id="searchrow">
    <input id="q" type="search" placeholder="소스명·커버내용·설명 전체 검색" aria-label="소스 검색">
  </div>
  <div class="crosshit" id="crosshit"></div>
</header>

<nav id="nav"></nav>

<div id="list"></div>

<footer>

  <p><b>휴민트</b> — 3: 당사자가 직접 발표하는 원문 채널 · 2: 당사자에 준하는 국영·업계 표준 자료 · 1: 지역 특수 언론 등 1차에 준해 쓰는 예외</p>
  <p>엑셀은 뉴스·휴민트·메모 세 시트로 오갑니다. 방법론 시트는 사이트에서 읽지도 쓰지도 않으니 엑셀에서만 관리하시면 됩니다.</p>
  <div class="datatools">
    <span class="cap">데이터 관리</span>
    <button id="btnTemplate">엑셀 양식 받기</button>
    <button id="btnExport">현재 목록 내보내기</button>
    <button class="primary" id="btnImport">엑셀 올리기</button>
    <input type="file" id="file" accept=".xlsx,.xls,.csv">
    <span class="status" id="status"></span>
  </div>
</footer>

</div>

  else rating = Math.max(0,Math.min(3,parseInt(rating,10)||0));
  return {cls:cls,
    sector:String(r.sector||"미분류").trim(), item:String(r.item||"").trim(), theme:String(r.theme||"").trim(),
    name:String(r.name||"").trim(), cover:String(r.cover||"").trim(), desc:String(r.desc||"").trim(),
    url:String(r.url||"").trim(), rating:rating, note:String(r.note||"").trim()};
}

/* ---------- 네비 ---------- */
function newsSectors(p){
  const found = uniq(p.map(r=>r.sector));
  const ordered = NEWS_ORDER.filter(s=>found.includes(s)).concat(found.filter(s=>!NEWS_ORDER.includes(s)));
  return (p.some(isCore) ? ["CORE"] : []).concat(ordered);
}
function resolveState(){
  const p = pool();
  if(state.cls==="뉴스"){
    const sectors = newsSectors(p);
    if(!sectors.includes(state.sector)) state.sector = sectors[0] || null;
    return {sectors, items:[], themes:[]};
  }
  const sectors = uniq(p.map(r=>r.sector));
  if(!sectors.includes(state.sector)) state.sector = sectors[0] || null;
  const items = uniq(p.filter(r=>r.sector===state.sector).map(r=>r.item));
  if(!items.includes(state.item)) state.item = items[0] || null;
  const themes = uniq(p.filter(r=>r.sector===state.sector && r.item===state.item).map(r=>r.theme));
  if(!themes.includes(state.theme)) state.theme = themes[0] || null;
  return {sectors, items, themes};
}
function countBy(rows,key){const m={};rows.forEach(r=>{m[r[key]]=(m[r[key]]||0)+1});return m;}
function levelHTML(label, values, selected, level, counts){
  if(!values.length) return "";
  return `<div class="level l${level}"><span class="lbl">${label}</span>` +
    values.map(v=>`<button class="tab${v==="CORE"?" corebtn":""}" role="tab" aria-selected="${v===selected}" data-level="${level}" data-value="${esc(v)}">${esc(v||"—")}<span class="n">${counts[v]||0}</span></button>`).join("")+`</div>`;
}

/* ---------- 렌더 ---------- */
function render(){
  document.getElementById("modes").innerHTML = MODES.map(c=>{
    const n = c==="메모" ? NOTES.length : DATA.filter(r=>r.cls===c).length;
    return `<button class="mode" data-mode="${c}" aria-selected="${c===state.cls}">${c}<span class="n">${n}</span></button>`;
  }).join("");
  document.getElementById("modehint").textContent = HINTS[state.cls];
  document.getElementById("total").textContent = DATA.length;

  const isMemo = state.cls==="메모";
  document.getElementById("searchrow").style.display = isMemo ? "none" : "";
  document.getElementById("crosshit").style.display = isMemo ? "none" : "";
  if(isMemo){ renderMemo(); return; }

  const {sectors, items, themes} = resolveState();
  const p = pool();
  let rows;
  if(state.cls==="뉴스"){
    const counts = countBy(p,"sector"); counts["CORE"] = p.filter(isCore).length;
    document.getElementById("nav").innerHTML = levelHTML("분류", sectors, state.sector, 1, counts);
    rows = state.sector==="CORE" ? p.filter(isCore) : p.filter(r=>r.sector===state.sector);
    document.getElementById("pathLabel").textContent = state.sector==="CORE" ? "CORE — 매일 도는 루틴" : (state.sector||"—");
  }else{
    const inSector = p.filter(r=>r.sector===state.sector);
    const inItem = inSector.filter(r=>r.item===state.item);
    rows = inItem.filter(r=>r.theme===state.theme);
    document.getElementById("nav").innerHTML =
      levelHTML("섹터", sectors, state.sector, 1, countBy(p,"sector")) +
      levelHTML("상품", items, state.item, 2, countBy(inSector,"item")) +
      levelHTML("테마", themes, state.theme, 3, countBy(inItem,"theme"));
    document.getElementById("pathLabel").textContent = state.sector ? `${state.sector} › ${state.item} › ${state.theme}` : "—";
  }
  document.getElementById("count").textContent = rows.length ? `${rows.length}개 소스` : "";

  const other = state.cls==="뉴스" ? "휴민트" : "뉴스";
  const hits = state.q ? DATA.filter(r=>r.cls===other && matches(r)).length : 0;
  document.getElementById("crosshit").innerHTML = hits ? `${other} 탭에 ${hits}건 더 있습니다 <button id="jump">${other}에서 보기</button>` : "";

  const list = document.getElementById("list");
  if(!rows.length){
    list.innerHTML = `<div class="empty"><b>${state.q?"검색 결과가 없습니다":"아직 등록된 소스가 없습니다"}</b>
      ${state.q?"다른 단어로 찾아보세요.":"아래 데이터 관리에서 엑셀 양식을 받아 채운 뒤 올리면 이 자리에 들어옵니다."}</div>`;
    return;
  }
  list.innerHTML = rows.slice().sort((a,b)=>rank(b)-rank(a)).map(r=>{
    const core = isCore(r);
    const n = parseInt(r.rating,10)||0;
    const badge = core ? `<span class="corepill">CORE</span>`
      : `<span class="bars">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join("")}<em>중요도 ${n}</em></span>`;
    const cad = CADENCE.find(c=>String(r.note).startsWith(c));
    const rest = cad ? String(r.note).slice(cad.length).replace(/^\s*\/\s*/,"").trim() : r.note;
    const path = state.cls==="뉴스" ? [r.item,r.theme].filter(Boolean).join(" · ")
                                    : (state.sector==="CORE" ? "" : "");
    return `<article class="src ${core?"core":"r"+n}">
      <div class="srctop">
        <h3 class="name">${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>`:esc(r.name)}</h3>
        ${badge}
      </div>
      <div class="chips">
        ${r.cover?`<span class="cover">${esc(r.cover)}</span>`:""}
        ${path?`<span class="tagpath">${esc(path)}</span>`:""}
        ${core&&state.sector==="CORE"?`<span class="tagpath">${esc(r.sector)}</span>`:""}
        ${cad?`<span class="cadence">${esc(cad)}</span>`:""}
      </div>
      ${r.desc?`<p class="desc">${esc(r.desc)}${rest?` <span style="color:var(--ink-3)">— ${esc(rest)}</span>`:""}</p>`:(rest?`<p class="desc" style="color:var(--ink-3)">${esc(rest)}</p>`:"")}
      <span class="url">${esc(r.url)}</span>
    </article>`;
  }).join("");
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g, m=>`<a href="${m}" target="_blank" rel="noopener noreferrer">${m}</a>`);
}
function renderMemo(){
  document.getElementById("nav").innerHTML = "";
  document.getElementById("pathLabel").textContent = "메모";
  document.getElementById("count").textContent = NOTES.length ? `${NOTES.length}개` : "";
  const list = document.getElementById("list");
  const form = `<div class="memoform">
      <textarea id="newnote" placeholder="방법론, 검토 중인 소스, 확인할 것 등 자유롭게"></textarea>
      <div class="row"><span>줄바꿈 그대로 저장되고, 링크는 자동으로 눌리게 됩니다</span><button class="primary" id="addnote">메모 추가</button></div>
    </div>`;
  const items = NOTES.length ? NOTES.map((t,i)=> state.editing===i
      ? `<div class="memo"><textarea id="edit-${i}">${esc(t)}</textarea>
           <div class="acts"><button data-cancel="${i}">취소</button><button class="primary" data-save="${i}">저장</button></div></div>`
      : `<div class="memo"><div class="body">${linkify(t)}</div>
           <div class="acts"><button data-edit="${i}">수정</button><button data-del="${i}">삭제</button></div></div>`
    ).join("") : `<div class="empty"><b>메모가 없습니다</b>위에 적어서 추가하세요.</div>`;
  list.innerHTML = form + items;
}

/* ---------- 엑셀 ---------- */
function downloadBook(filename){
  const wb=XLSX.utils.book_new();
  ["뉴스","휴민트"].forEach(c=>{
    const rows=DATA.filter(r=>r.cls===c);
    const ws=XLSX.utils.aoa_to_sheet([COLS, ...rows.map(r=>KEYS.map(k=>r[k]))]);
    ws["!cols"]=[{wch:14},{wch:16},{wch:16},{wch:34},{wch:24},{wch:62},{wch:46},{wch:7},{wch:22}];
    XLSX.utils.book_append_sheet(wb,ws,c);
  });
  const wm=XLSX.utils.aoa_to_sheet([["메모"], ...NOTES.map(t=>[t])]);
  wm["!cols"]=[{wch:100}];
  XLSX.utils.book_append_sheet(wb,wm,"메모");
  XLSX.writeFile(wb,filename);
}
function pickCell(row,col){
  if(row[col]!==undefined) return row[col];
  for(const alt of (ALIASES[col]||[])) if(row[alt]!==undefined) return row[alt];
  return "";
}
function importFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      let out=[], notes=null;
      wb.SheetNames.forEach(sn=>{
        if(sn.includes("메모")){
          const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""});
          notes = aoa.map(r=>r.map(c=>String(c==null?"":c).trim()).filter(Boolean).join(" — "))
                     .filter(t=>t && t!=="메모");
          return;
        }
        const cls = sn.includes("뉴스") ? "뉴스" : (sn.includes("휴민트") ? "휴민트" : null);
        if(!cls) return;
        XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""}).forEach(row=>{
          const o={}; COLS.forEach((c,i)=>{o[KEYS[i]]=pickCell(row,c);});
          const n=normalize(o,cls); if(n.name) out.push(n);
        });
      });
      if(!out.length && !notes) throw new Error();
      if(out.length) DATA=out;
      if(notes) NOTES=notes;
      state={cls:state.cls,sector:null,item:null,theme:null,q:state.q,editing:null};
      render(); save();
      setStatus(`갱신 완료 — 뉴스 ${DATA.filter(r=>r.cls==="뉴스").length} / 휴민트 ${DATA.filter(r=>r.cls==="휴민트").length} / 메모 ${NOTES.length}`);
    }catch(err){ setStatus("읽지 못했습니다 — 시트 이름(뉴스·휴민트·메모)과 열 이름을 유지해 주세요"); }
  };
  reader.readAsArrayBuffer(file);
}
let t;
function setStatus(m){const el=document.getElementById("status");el.textContent=m;clearTimeout(t);t=setTimeout(()=>{el.textContent="";},6000);}

/* ---------- 이벤트 ---------- */
document.getElementById("modes").addEventListener("click",e=>{
  const b=e.target.closest(".mode"); if(!b) return;
  state.cls=b.dataset.mode; state.sector=null; state.item=null; state.theme=null; state.editing=null; render();
});
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  const lvl=+b.dataset.level, v=b.dataset.value;
  if(lvl===1){state.sector=v;state.item=null;state.theme=null;}
  if(lvl===2){state.item=v;state.theme=null;}
  if(lvl===3){state.theme=v;}
  render();
});
document.getElementById("crosshit").addEventListener("click",e=>{
  if(e.target.id==="jump"){ state.cls=state.cls==="뉴스"?"휴민트":"뉴스"; state.sector=null;state.item=null;state.theme=null; render(); }
});
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="addnote"){
    const v=document.getElementById("newnote").value.trim();
    if(!v) return;
    NOTES.unshift(v); state.editing=null; render(); save(); return;
  }
  if(b.dataset.del!==undefined){ NOTES.splice(+b.dataset.del,1); render(); save(); return; }
  if(b.dataset.edit!==undefined){ state.editing=+b.dataset.edit; render(); return; }
  if(b.dataset.cancel!==undefined){ state.editing=null; render(); return; }
  if(b.dataset.save!==undefined){
    const i=+b.dataset.save, v=document.getElementById("edit-"+i).value.trim();
    if(v) NOTES[i]=v; else NOTES.splice(i,1);
    state.editing=null; render(); save(); return;
  }
});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
document.getElementById("btnTemplate").addEventListener("click",()=>{downloadBook("commo_resource_양식.xlsx");setStatus("현재 목록이 들어간 양식을 내려받았습니다");});
document.getElementById("btnExport").addEventListener("click",()=>downloadBook("commo_resource.xlsx"));
document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("file").click());
document.getElementById("file").addEventListener("change",e=>{ if(e.target.files[0]) importFile(e.target.files[0]); e.target.value=""; });

(async()=>{await load();render();})();
</script>
