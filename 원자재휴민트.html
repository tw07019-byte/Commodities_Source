<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원자재 휴민트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EBEDE8; --surface:#F7F8F4; --surface-2:#FFFFFF;
    --line:#D0D5CA; --line-soft:#E1E5DB;
    --ink:#14201C; --ink-2:#5A655E; --ink-3:#8A938C;
    --copper:#2E6B5A; --signal:#B4462A; --amber:#9A7B22;
    --radius:3px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}

  header{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:16px}
  .titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-0.02em;font-weight:700}
  .sub{margin:8px 0 0;color:var(--ink-2);font-size:14px;max-width:62ch}
  .readout{text-align:right;color:var(--ink-2);font-size:13px;white-space:nowrap}
  .readout b{display:block;font-size:26px;color:var(--ink);font-weight:700;line-height:1}

  .searchrow{margin:16px 0 4px}
  .searchrow input{
    width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface-2);font:inherit;color:var(--ink);
  }
  .searchrow input:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:var(--copper)}

  button{
    font:inherit;font-size:13.5px;padding:9px 13px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);border-radius:var(--radius);cursor:pointer;
  }
  button:hover{border-color:var(--ink-2)}
  button:focus-visible{outline:2px solid var(--copper);outline-offset:1px}
  button.primary{background:var(--ink);color:#F4F6F1;border-color:var(--ink)}
  button.primary:hover{background:#22322C}
  input[type=file]{display:none}

  .level{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .level:last-child{border-bottom:none}
  .level .lbl{width:52px;flex:none;color:var(--ink-3);font-size:12px}
  .tab{padding:5px 11px;border:1px solid transparent;border-radius:var(--radius);background:none;color:var(--ink-2);font-size:14px}
  .tab .n{color:var(--ink-3);font-size:12px;margin-left:5px}
  .tab:hover{background:#E3E7DE}
  .tab[aria-selected="true"]{background:var(--ink);color:#F4F6F1;border-color:var(--ink);font-weight:600}
  .tab[aria-selected="true"] .n{color:#A9B5AC}
  .l1 .tab{font-size:16px;font-weight:600;color:var(--ink)}
  .l1 .tab[aria-selected="true"]{background:var(--copper);border-color:var(--copper)}

  .listhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .listhead h2{font-size:15px;margin:0;font-weight:600}
  .listhead span{color:var(--ink-3);font-size:13px}

  .src{background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--ink-3);border-radius:var(--radius);padding:14px 16px;margin-bottom:9px}
  .src.r5{border-left-color:var(--signal)}
  .src.r4{border-left-color:var(--copper)}
  .src.r3{border-left-color:var(--amber)}
  .srctop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .name{font-size:17px;font-weight:700;letter-spacing:-0.01em;margin:0}
  .name a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--copper);padding-bottom:1px}
  .name a:hover{color:var(--copper)}
  .name a:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .bars{display:flex;gap:2px;align-items:center}
  .bars i{width:7px;height:13px;background:var(--line);display:block;border-radius:1px}
  .bars i.on{background:var(--signal)}
  .bars em{font-style:normal;color:var(--ink-3);font-size:12px;margin-left:4px}
  .cover{display:inline-block;background:#E3E7DE;color:var(--ink-2);font-size:12.5px;padding:2px 8px;border-radius:2px;margin:8px 0 0}
  .desc{margin:8px 0 0;color:var(--ink-2);font-size:14px;max-width:76ch}
  .srcfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
  .rss{font-size:12px;padding:2px 7px;border-radius:2px;border:1px solid var(--line)}
  .rss.yes{border-color:var(--copper);color:var(--copper)}
  .rss.no{color:var(--ink-3)}
  .rss.chk{border-color:var(--amber);color:var(--amber)}
  .url{font-size:12.5px;color:var(--ink-3);word-break:break-all}
  .mini{padding:4px 9px;font-size:12.5px}
  .feed{margin-top:11px;padding:11px 12px;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--radius);font-size:13.5px;color:var(--ink-2)}
  .feed ol{margin:6px 0 0;padding-left:18px}
  .feed a{color:var(--copper)}
  .empty{padding:34px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--radius)}
  .empty b{display:block;color:var(--ink);margin-bottom:6px}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
  footer p{margin:4px 0;max-width:80ch}
  .datatools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .datatools .cap{color:var(--ink-3);font-size:12.5px;margin-right:4px}
  .datatools button{font-size:12.5px;padding:6px 11px}
  .status{font-size:12.5px;color:var(--copper)}

  @media (max-width:640px){
    h1{font-size:24px}
    .readout{text-align:left}
    .level .lbl{width:100%;margin-bottom:2px}
    .wrap{padding:20px 14px 48px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="titlerow">
    <div>
      <h1>원자재 휴민트</h1>
      <p class="sub">가격이 움직이기 전에 말이 나오는 곳들. 발표 주체가 직접 올리는 1차 채널만 모읍니다.</p>
    </div>
    <div class="readout"><b id="total">0</b>등록된 소스</div>
  </div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="소스명·커버내용·설명 전체 검색" aria-label="소스 검색">
  </div>
</header>

<nav id="nav"></nav>

<div class="listhead">
  <h2 id="pathLabel">—</h2>
  <span id="count"></span>
</div>

<div id="list"></div>

<footer>
  <p>1차성 등급: 5 = 당사자가 직접 발표하는 원문 채널 · 4 = 당사자에 준하는 국영·업계 표준 자료 · 3 이하 = 2차 가공 매체</p>
  <p>RSS 상태가 <b>미확인</b>인 항목은 피드 주소를 아직 검증하지 않았습니다. 엑셀에서 채워 넣고 다시 올리면 갱신됩니다.</p>
  <div class="datatools">
    <span class="cap">데이터 관리</span>
    <button id="btnTemplate">엑셀 양식 받기</button>
    <button id="btnExport">현재 목록 내보내기</button>
    <button class="primary" id="btnImport">엑셀 올리기</button>
    <input type="file" id="file" accept=".xlsx,.xls,.csv">
    <span class="status" id="status"></span>
  </div>
</footer>

</div>

let DATA = SEED_ROWS.map(r => Object.fromEntries(KEYS.map((k,i)=>[k, r[i]])));
let state = {sector:null, item:null, theme:null, q:""};

/* ---------- 저장 ---------- */
async function save(){
  if(!window.storage) return;
  try{ await window.storage.set(STORE_KEY, JSON.stringify(DATA)); }catch(e){}
}
async function load(){
  if(!window.storage) return;
  try{
    const r = await window.storage.get(STORE_KEY);
    if(r && r.value){
      const p = JSON.parse(r.value);
      if(Array.isArray(p) && p.length) DATA = p;
    }
  }catch(e){}
}

/* ---------- 유틸 ---------- */
const uniq = a => [...new Set(a)];
function matches(r){
  if(!state.q) return true;
  const s = state.q.toLowerCase();
  return KEYS.some(k => String(r[k]||"").toLowerCase().includes(s));
}
const pool = () => DATA.filter(matches);

function normalize(r){
  return {
    sector:String(r.sector||"Unsorted").trim(),
    item:String(r.item||"Unsorted").trim(),
    theme:String(r.theme||"General").trim(),
    name:String(r.name||"").trim(),
    cover:String(r.cover||"").trim(),
    desc:String(r.desc||"").trim(),
    url:String(r.url||"").trim(),
    rss:(["있음","없음","미확인"].includes(String(r.rss||"").trim()) ? String(r.rss).trim() : "미확인"),
    rssUrl:String(r.rssUrl||"").trim(),
    rating:Math.max(0,Math.min(5,parseInt(r.rating,10)||0)),
    note:String(r.note||"").trim()
  };
}

/* ---------- 네비 ---------- */
function resolveState(){
  const p = pool();
  const sectors = uniq(p.map(r=>r.sector));
  if(!sectors.includes(state.sector)) state.sector = sectors[0] || null;
  const items = uniq(p.filter(r=>r.sector===state.sector).map(r=>r.item));
  if(!items.includes(state.item)) state.item = items[0] || null;
  const themes = uniq(p.filter(r=>r.sector===state.sector && r.item===state.item).map(r=>r.theme));
  if(!themes.includes(state.theme)) state.theme = themes[0] || null;
  return {sectors, items, themes};
}
function countBy(rows,key){const m={};rows.forEach(r=>{m[r[key]]=(m[r[key]]||0)+1});return m;}
function levelHTML(label, values, selected, level, counts){
  if(!values.length) return "";
  return `<div class="level l${level}"><span class="lbl">${label}</span>` +
    values.map(v=>`<button class="tab" role="tab" aria-selected="${v===selected}" data-level="${level}" data-value="${esc(v)}">${esc(v)}<span class="n">${counts[v]||0}</span></button>`).join("") +
    `</div>`;
}

/* ---------- 렌더 ---------- */
function render(){
  const {sectors, items, themes} = resolveState();
  const p = pool();
  const inSector = p.filter(r=>r.sector===state.sector);
  const inItem = inSector.filter(r=>r.item===state.item);
  const rows = inItem.filter(r=>r.theme===state.theme);

  document.getElementById("nav").innerHTML =
    levelHTML("섹터", sectors, state.sector, 1, countBy(p,"sector")) +
    levelHTML("상품", items, state.item, 2, countBy(inSector,"item")) +
    levelHTML("테마", themes, state.theme, 3, countBy(inItem,"theme"));

  document.getElementById("total").textContent = DATA.length;
  document.getElementById("pathLabel").textContent = state.sector ? `${state.sector} › ${state.item} › ${state.theme}` : "—";
  document.getElementById("count").textContent = rows.length ? `${rows.length}개 소스` : "";

  const list = document.getElementById("list");
  if(!rows.length){
    list.innerHTML = `<div class="empty"><b>${state.q?"검색 결과가 없습니다":"아직 등록된 소스가 없습니다"}</b>
      ${state.q?"다른 단어로 찾아보세요.":"아래 데이터 관리에서 엑셀 양식을 받아 채운 뒤 올리면 이 자리에 들어옵니다."}</div>`;
    return;
  }

  list.innerHTML = rows.slice().sort((a,b)=>b.rating-a.rating).map(r=>{
    const idx = DATA.indexOf(r);
    const bars = [1,2,3,4,5].map(n=>`<i class="${n<=r.rating?'on':''}"></i>`).join("");
    const cls = r.rss==="있음"?"yes":(r.rss==="없음"?"no":"chk");
    return `<article class="src r${r.rating}">
      <div class="srctop">
        <h3 class="name">${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>`:esc(r.name)}</h3>
        <span class="bars">${bars}<em>1차성 ${r.rating}</em></span>
      </div>
      ${r.cover?`<div class="cover">${esc(r.cover)}</div>`:""}
      <p class="desc">${esc(r.desc)}${r.note?` <span style="color:var(--ink-3)">— ${esc(r.note)}</span>`:""}</p>
      <div class="srcfoot">
        <span class="rss ${cls}">RSS ${esc(r.rss)}</span>
        ${r.rssUrl?`<button class="mini" data-feed="${idx}">최신 기사 불러오기</button>`:""}
        <span class="url">${esc(r.url)}</span>
      </div>
      <div class="feed" id="feed-${idx}" style="display:none"></div>
    </article>`;
  }).join("");
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- RSS ---------- */
async function loadFeed(idx){
  const r = DATA[idx], box = document.getElementById("feed-"+idx);
  if(!box) return;
  box.style.display="block"; box.textContent="불러오는 중…";
  try{
    const res = await fetch(r.rssUrl);
    if(!res.ok) throw new Error();
    const xml = new DOMParser().parseFromString(await res.text(),"text/xml");
    const items=[...xml.querySelectorAll("item, entry")].slice(0,5);
    if(!items.length) throw new Error();
    box.innerHTML = "<ol>"+items.map(it=>{
      const t=it.querySelector("title")?.textContent||"제목 없음";
      const l=it.querySelector("link")?.textContent||it.querySelector("link")?.getAttribute("href")||r.url;
      return `<li><a href="${esc(l)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a></li>`;
    }).join("")+"</ol>";
  }catch(e){
    box.innerHTML = `브라우저에서 외부 피드를 직접 읽는 건 보안 정책(CORS) 때문에 대부분 막힙니다.
      사이트로 배포할 때 피드를 대신 받아오는 서버 한 단만 두면 이 자리에 최신 기사 5건이 뜹니다.
      <br><a href="${esc(r.rssUrl)}" target="_blank" rel="noopener noreferrer">피드 주소 직접 열기</a>`;
  }
}

/* ---------- 엑셀 ---------- */
function downloadBook(rows, filename){
  const ws = XLSX.utils.aoa_to_sheet([COLS, ...rows.map(r=>KEYS.map(k=>r[k]))]);
  ws["!cols"]=[{wch:18},{wch:16},{wch:16},{wch:32},{wch:24},{wch:60},{wch:46},{wch:8},{wch:34},{wch:6},{wch:20}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"휴민트");
  XLSX.writeFile(wb,filename);
}
function pickCell(row, col){
  if(row[col]!==undefined) return row[col];
  for(const alt of (ALIASES[col]||[])) if(row[alt]!==undefined) return row[alt];
  return "";
}
function importFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const mapped=raw.map(row=>{
        const o={};
        COLS.forEach((c,i)=>{o[KEYS[i]]=pickCell(row,c);});
        return normalize(o);
      }).filter(r=>r.name);
      if(!mapped.length) throw new Error();
      DATA=mapped;
      state={sector:null,item:null,theme:null,q:state.q};
      render(); save();
      setStatus(`${mapped.length}개 소스로 갱신했습니다`);
    }catch(err){
      setStatus("읽지 못했습니다 — 양식의 열 이름을 그대로 유지해 주세요");
    }
  };
  reader.readAsArrayBuffer(file);
}
let t;
function setStatus(m){
  const el=document.getElementById("status");
  el.textContent=m; clearTimeout(t); t=setTimeout(()=>{el.textContent="";},5000);
}

/* ---------- 이벤트 ---------- */
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  const lvl=+b.dataset.level, v=b.dataset.value;
  if(lvl===1){state.sector=v;state.item=null;state.theme=null;}
  if(lvl===2){state.item=v;state.theme=null;}
  if(lvl===3){state.theme=v;}
  render();
});
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("[data-feed]"); if(b) loadFeed(+b.dataset.feed);
});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
document.getElementById("btnTemplate").addEventListener("click",()=>{
  downloadBook(DATA,"원자재휴민트_양식.xlsx");
  setStatus("현재 목록이 들어간 양식을 내려받았습니다");
});
document.getElementById("btnExport").addEventListener("click",()=>downloadBook(DATA,"원자재휴민트.xlsx"));
document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("file").click());
document.getElementById("file").addEventListener("change",e=>{
  if(e.target.files[0]) importFile(e.target.files[0]);
  e.target.value="";
});

(async()=>{await load();render();})();
</script>
</body>
</html>
